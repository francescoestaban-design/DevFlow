spring.application.name=devflow

# Conexión a la base de datos PostgreSQL de Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/devflow_db
spring.datasource.username=devflow_user
spring.datasource.password=devflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect